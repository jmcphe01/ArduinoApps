<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Tracker</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .card { background: #1c1c1c; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .predictions { display: flex; gap: 12px; }
    .predictions div { flex: 1; text-align: center; }
    .predictions .label { font-size: 12px; color: #888; text-transform: uppercase; }
    .predictions .value { font-size: 20px; font-weight: bold; margin-top: 4px; }
    .labels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    button { font-size: 16px; padding: 14px; border-radius: 10px; border: none; cursor: pointer; }
    button.record { background: #2a6; color: white; }
    button.record.active { background: #c33; }
    button.stop { background: #c33; color: white; width: 100%; margin-top: 8px; }
    button.train { background: #36c; color: white; width: 100%; }
    button.erase { background: #900; color: white; width: 100%; }
    button.reset-steps { background: #555; color: white; width: 100%; margin-top: 10px; }
    .step-count { font-size: 48px; font-weight: bold; text-align: center; }
    #status-line { font-size: 13px; color: #999; margin-top: 8px; }
    .chart-legend { font-size: 11px; color: #888; margin-top: 6px; }
    .chart-legend span { margin-right: 2px; }
  </style>
</head>
<body>
  <h1>Activity Tracker</h1>
  <div id="status-line">connecting...</div>

  <div class="card">
    <div class="predictions">
      <div>
        <div class="label">Model 1 (one axis)</div>
        <div class="value" id="prediction1">-</div>
      </div>
      <div>
        <div class="label">Model 2 (full IMU, KNN)</div>
        <div class="value" id="prediction2">-</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Steps (neural net)</div>
    <div class="step-count" id="step-count">0</div>
    <button class="reset-steps" id="reset-steps-btn">Reset Step Count</button>
  </div>

  <div class="card">
    <div class="label">Step Training Data</div>
    <div class="labels">
      <button class="record" id="record-step-btn">Record Steps</button>
      <button class="record" id="record-nonstep-btn">Record Non-Step Motion</button>
    </div>
    <button class="stop" id="step-stop-btn">Stop Recording</button>
    <div id="step-record-status" style="margin-top:12px; font-size: 13px; color: #aaa;"></div>
    <button class="train" id="retrain-steps-btn" style="margin-top: 12px;">Retrain Step Net</button>
    <div id="retrain-result" style="margin-top: 8px; font-size: 13px; color: #aaa;"></div>
  </div>

  <div class="card">
    <div class="label">Calibration</div>
    <div class="labels" id="label-buttons"></div>
    <button class="stop" id="stop-btn">Stop Recording</button>
    <div id="counts" style="margin-top:12px; font-size: 13px; color: #aaa;"></div>
  </div>

  <div class="card">
    <button class="train" id="train-btn">Train Models</button>
    <div id="train-result" style="margin-top: 8px; font-size: 13px; color: #aaa;"></div>
  </div>

  <div class="card">
    <button class="erase" id="erase-btn">Erase All Training Data</button>
    <div id="erase-result" style="margin-top: 8px; font-size: 13px; color: #aaa;"></div>
  </div>

  <div class="card">
    <div class="label">Live Acceleration (g)</div>
    <canvas id="accel-chart" height="100" style="width:100%; height:100px; display:block;"></canvas>
    <div class="chart-legend">
      <span style="color:#e55">■</span> X
      <span style="color:#5e5">■</span> Y
      <span style="color:#59f">■</span> Z
    </div>
  </div>

  <div class="card">
    <div class="label">Live Gyro (deg/s)</div>
    <canvas id="gyro-chart" height="100" style="width:100%; height:100px; display:block;"></canvas>
    <div class="chart-legend">
      <span style="color:#e55">■</span> X
      <span style="color:#5e5">■</span> Y
      <span style="color:#59f">■</span> Z
    </div>
  </div>

  <div class="card">
    <div class="label">Live Prediction</div>
    <div class="chart-legend" style="margin-bottom:6px;">Model 1</div>
    <canvas id="pred1-chart" height="24" style="width:100%; height:24px; display:block;"></canvas>
    <div class="chart-legend" style="margin:10px 0 6px;">Model 2</div>
    <canvas id="pred2-chart" height="24" style="width:100%; height:24px; display:block;"></canvas>
  </div>

<script>
const labelButtonsEl = document.getElementById('label-buttons');
const stopBtn = document.getElementById('stop-btn');
const trainBtn = document.getElementById('train-btn');
const eraseBtn = document.getElementById('erase-btn');
const resetStepsBtn = document.getElementById('reset-steps-btn');
const recordStepBtn = document.getElementById('record-step-btn');
const recordNonstepBtn = document.getElementById('record-nonstep-btn');
const stepStopBtn = document.getElementById('step-stop-btn');
const retrainStepsBtn = document.getElementById('retrain-steps-btn');
const accelCanvas = document.getElementById('accel-chart');
const gyroCanvas = document.getElementById('gyro-chart');
const pred1Canvas = document.getElementById('pred1-chart');
const pred2Canvas = document.getElementById('pred2-chart');

let labels = [];
let currentRecordingLabel = null;

// Rolling history for the live graphs. Accel/gyro are sampled faster than
// predictions since the raw signal changes a lot quicker than the classifier
// output does.
const ACCEL_HISTORY_LEN = 100; // ~25s at the 250ms sample-poll rate below
const PRED_HISTORY_LEN = 60;   // ~60s at the 1s status-poll rate
let accelHistory = []; // each entry: [ax, ay, az]
let gyroHistory = [];  // each entry: [gx, gy, gz]
let pred1History = []; // label strings, oldest first
let pred2History = [];

const AXIS_COLORS = ['#e55', '#5e5', '#59f']; // x, y, z
const LABEL_COLORS = { standing: '#666', walking: '#3a7bd5', running: '#e8742a', biking: '#2a6' };

// Keep the canvas's backing pixel size in sync with its CSS width so the
// lines stay crisp instead of stretched/blurry.
function fitCanvasWidth(canvas) {
  const cssWidth = Math.round(canvas.getBoundingClientRect().width);
  if (cssWidth > 0 && canvas.width !== cssWidth) canvas.width = cssWidth;
}

function drawLineChart(canvas, seriesList, colors) {
  fitCanvasWidth(canvas);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const allValues = seriesList.flat();
  if (allValues.length === 0) return;
  let min = Math.min(...allValues), max = Math.max(...allValues);
  if (max - min < 1e-6) { max += 0.5; min -= 0.5; } // avoid a flat, divide-by-zero chart
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;

  const toY = (v) => h - ((v - min) / (max - min)) * h;
  seriesList.forEach((series, idx) => {
    ctx.strokeStyle = colors[idx];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    series.forEach((v, i) => {
      const x = (i / Math.max(series.length - 1, 1)) * w;
      const y = toY(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}

function drawPredictionStrip(canvas, history) {
  fitCanvasWidth(canvas);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const barWidth = w / PRED_HISTORY_LEN;
  history.forEach((label, i) => {
    ctx.fillStyle = LABEL_COLORS[label] || '#333';
    ctx.fillRect(i * barWidth, 0, Math.ceil(barWidth) + 1, h);
  });
}

async function api(method, path, query) {
  // The server reads plain parameters (like label: str) as URL query
  // parameters, not a JSON body - so build the query string ourselves.
  const qs = query ? '?' + new URLSearchParams(query).toString() : '';
  const res = await fetch(path + qs, { method });
  return res.json();
}

function renderLabelButtons() {
  labelButtonsEl.innerHTML = '';
  for (const label of labels) {
    const btn = document.createElement('button');
    btn.className = 'record' + (label === currentRecordingLabel ? ' active' : '');
    btn.textContent = 'Record ' + label;
    btn.onclick = () => api('POST', '/start_recording', { label }).then(refresh);
    labelButtonsEl.appendChild(btn);
  }
}

stopBtn.onclick = () => api('POST', '/stop_recording').then(refresh);

trainBtn.onclick = async () => {
  const result = await api('POST', '/train');
  const acc = result.loo_accuracy;
  document.getElementById('train-result').textContent =
    `Trained on ${result.rows} windows. Model 2 leave-one-out accuracy: ` +
    (acc === null || acc === undefined ? 'n/a (need more data)' : (acc * 100).toFixed(0) + '%');
};

eraseBtn.onclick = async () => {
  if (!confirm('Erase ALL recorded training data and untrain both models? This cannot be undone.')) return;
  await api('POST', '/erase_calibration');
  document.getElementById('train-result').textContent = '';
  document.getElementById('erase-result').textContent = 'Training data erased.';
  refresh();
};

resetStepsBtn.onclick = () => api('POST', '/reset_steps').then(refresh);

recordStepBtn.onclick = () => api('POST', '/start_step_recording').then(refresh);
recordNonstepBtn.onclick = () => api('POST', '/start_nonstep_recording').then(refresh);
stepStopBtn.onclick = () => api('POST', '/stop_recording').then(refresh);

retrainStepsBtn.onclick = async () => {
  const resultEl = document.getElementById('retrain-result');
  resultEl.textContent = 'Training...';
  const result = await api('POST', '/retrain_step_net');
  if (!result.ok) {
    resultEl.textContent = 'Could not retrain: ' + result.error;
    return;
  }
  const acc = result.holdout_accuracy;
  resultEl.textContent = `Retrained on ${result.candidates} candidate peaks. ` +
    `Holdout accuracy: ` + (acc === null || acc === undefined ? 'n/a (need more data)' : (acc * 100).toFixed(0) + '%');
};

async function refresh() {
  const s = await api('GET', '/status');
  labels = s.labels;
  currentRecordingLabel = s.recording ? s.recording_label : null;
  renderLabelButtons();

  document.getElementById('prediction1').textContent = s.prediction1;
  document.getElementById('prediction2').textContent = s.prediction2;
  document.getElementById('step-count').textContent =
    s.step_net_loaded ? s.step_count : 'step net not loaded';

  pred1History.push(s.prediction1);
  pred2History.push(s.prediction2);
  if (pred1History.length > PRED_HISTORY_LEN) pred1History.shift();
  if (pred2History.length > PRED_HISTORY_LEN) pred2History.shift();
  drawPredictionStrip(pred1Canvas, pred1History);
  drawPredictionStrip(pred2Canvas, pred2History);

  const countsText = Object.entries(s.counts_by_label || {})
    .map(([label, n]) => `${label}: ${n}`).join(' · ') || 'no calibration data yet';
  document.getElementById('counts').textContent = countsText +
    (s.recording ? ` (recording ${s.recording_label}, +${s.rows_recorded_this_session} this session)` : '');

  const stepRecordingActive = s.recording && (s.recording_label === 'step' || s.recording_label === 'non_step');
  recordStepBtn.className = 'record' + (s.recording_label === 'step' ? ' active' : '');
  recordNonstepBtn.className = 'record' + (s.recording_label === 'non_step' ? ' active' : '');
  document.getElementById('step-record-status').textContent =
    stepRecordingActive ? `recording ${s.recording_label} (raw trace only, no feature snapshot)` : '';

  document.getElementById('status-line').textContent =
    s.connected ? 'connected to sketch' : 'not hearing from the sketch - check the MPU6050 wiring';
}

async function pollSample() {
  try {
    const s = await api('GET', '/sample');
    if (!s.sample) return;
    const [ax, ay, az, gx, gy, gz] = s.sample;
    accelHistory.push([ax, ay, az]);
    gyroHistory.push([gx, gy, gz]);
    if (accelHistory.length > ACCEL_HISTORY_LEN) accelHistory.shift();
    if (gyroHistory.length > ACCEL_HISTORY_LEN) gyroHistory.shift();
    drawLineChart(accelCanvas, [0, 1, 2].map((k) => accelHistory.map((p) => p[k])), AXIS_COLORS);
    drawLineChart(gyroCanvas, [0, 1, 2].map((k) => gyroHistory.map((p) => p[k])), AXIS_COLORS);
  } catch (e) {
    // Transient fetch error - the next poll will try again.
  }
}

renderLabelButtons();
refresh();
pollSample();
setInterval(refresh, 1000);
setInterval(pollSample, 250);
</script>
</body>
</html>
